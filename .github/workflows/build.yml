name: Build Repository

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Lune Runtime
        run: |
          LUNE_VERSION="0.8.6" # Change to the version you prefer or latest
          wget https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip
          unzip lune-${LUNE_VERSION}-linux-x86_64.zip
          sudo mv lune-* /usr/local/bin/lune
          sudo chmod +x /usr/local/bin/lune

      - name: Install Darklua
        run: |
          cargo install darklua

      - name: Run Build Script
        run: |
          lune run build.luau config.json
          
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-output
          path: Main.lua
